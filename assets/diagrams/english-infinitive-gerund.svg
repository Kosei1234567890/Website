<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">to不定詞と動名詞の違い</title><desc id="d">to＋動詞の原形はto不定詞。動詞＋ingは動名詞。どちらも名詞の働きをするが、直前の動詞で使い分ける。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f4ff"/><stop offset="1" stop-color="#e9f5f2"/></linearGradient></defs><rect width="960" height="480" rx="28" fill="url(#bg)"/><text x="480" y="61" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="bold" fill="#1d3044">to不定詞 vs 動名詞</text><g font-family="sans-serif"><rect x="47" y="96" width="420" height="290" rx="20" fill="#fff" stroke="#b9a9e6" stroke-width="3"/><rect x="493" y="96" width="420" height="290" rx="20" fill="#fff" stroke="#8dcfc2" stroke-width="3"/><rect x="68" y="118" width="378" height="62" rx="12" fill="#6349b9"/><rect x="514" y="118" width="378" height="62" rx="12" fill="#177a75"/><text x="257" y="158" font-weight="bold" font-size="29" fill="#fff" text-anchor="middle">to + 動詞の原形</text><text x="703" y="158" font-weight="bold" font-size="29" fill="#fff" text-anchor="middle">動詞 + ing</text><text x="257" y="220" font-size="23" font-weight="bold" fill="#293547" text-anchor="middle">to不定詞</text><text x="703" y="220" font-size="23" font-weight="bold" fill="#293547" text-anchor="middle">動名詞</text><text x="257" y="280" font-size="28" fill="#6349b9" text-anchor="middle">want to learn</text><text x="703" y="280" font-size="28" fill="#177a75" text-anchor="middle">enjoy learning</text><text x="257" y="326" font-size="19" fill="#546778" text-anchor="middle">学びたい</text><text x="703" y="326" font-size="19" fill="#546778" text-anchor="middle">学ぶことを楽しむ</text><text x="480" y="434" font-size="21" fill="#32485b" text-anchor="middle">意味と直前の動詞を見て選ぼう！</text></g></svg>