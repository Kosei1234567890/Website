name: Unpack StudyMaster website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-studymaster.yml"
      - "studymaster_v2_cloudflare(2).zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract StudyMaster site at repository root
        shell: bash
        run: |
          set -euo pipefail
          zip_file='studymaster_v2_cloudflare(2).zip'
          if [ ! -f "$zip_file" ]; then
            echo 'ZIP already extracted'
            exit 0
          fi
          unzip -q -o "$zip_file"
          test -s index.html
          test -s assets/styles.css
          test -s sitemap.xml
          git rm -- "$zip_file"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish StudyMaster v2 as site files'
          git push origin HEAD:main
